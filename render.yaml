# Render Blueprint — API only (server/). Dashboard 설정과 동일하게 맞춤.
services:
  - type: web
    name: mechuri-api
    runtime: node
    rootDir: server
    plan: starter
    # NODE_ENV=production 이면 devDependencies(tsc)가 빠져 TS 6이 돌아감
    buildCommand: YARN_PRODUCTION=false yarn install && yarn build
    startCommand: yarn start
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_SKIP_VERIFY
        value: 'true'
